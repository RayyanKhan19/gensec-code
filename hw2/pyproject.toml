[project]
name = "study-notes-rag"
version = "0.1.0"
description = "A Chainlit RAG app for JSON study notes"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.12.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-text-splitters>=1.1.0",
    "python-dotenv>=1.2.1",
]

[tool.uv]
package = false
